# Publishes the static web app to GitHub Pages. Manual only: run it from the Actions tab once
# Pages is enabled for the repository (Settings, Pages, Source: GitHub Actions).
name: Publish web app to Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the build needs no browser; skip Puppeteer's Chrome download (it is only used by the local checks)
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
